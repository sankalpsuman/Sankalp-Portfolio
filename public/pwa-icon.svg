<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPWA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGradPWA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glowPWA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradPWA)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#brandGradPWA)" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#brandGradPWA)" stroke-width="5" stroke-dasharray="14 10" opacity="0.7"/>

  <!-- Central SS Icon Monogram -->
  <g filter="url(#glowPWA)">
    <!-- Tech Shield Outline -->
    <path d="M256 80 L370 130 V260 C370 345 320 405 256 432 C192 405 142 345 142 260 V130 Z" fill="none" stroke="url(#brandGradPWA)" stroke-width="16" stroke-linejoin="round"/>
    
    <!-- Stylized "S" Tech Lines -->
    <path d="M296 185 H230 C205 185 190 200 190 220 C190 245 210 255 240 260 L272 266 C305 272 322 288 322 312 C322 338 300 355 270 355 H200" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spark / AI Node Dots -->
    <circle cx="330" cy="185" r="12" fill="#38bdf8"/>
    <circle cx="180" cy="355" r="12" fill="#7c3aed"/>
  </g>
</svg>
